name: Build AURA APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          ls -la
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP"
            rm "$ZIP"
          fi
          if [ -d "AURA_FIREBASE_GITHUB_FINAL" ]; then
            cp -r AURA_FIREBASE_GITHUB_FINAL/*. || true
            cp -r AURA_FIREBASE_GITHUB_FINAL/.*. 2>/dev/null || true
          fi
          ls -la
          ls -la app/ || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
      - name: Build APK
        run: |
          if [! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
