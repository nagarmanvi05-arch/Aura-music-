name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip AURA project
        run: |
          ls -la
          unzip -o *.zip || true
          rm -rf __MACOSX
          if [ -d "AURA_FIREBASE_GITHUB_FINAL" ]; then
            cp -rf AURA_FIREBASE_GITHUB_FINAL/* .
            rm -rf AURA_FIREBASE_GITHUB_FINAL
          fi
          rm -f *.zip
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-APK
          path: app/build/outputs/apk/debug/*.apk
