name: Build AURA APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
            rm *.zip
            if [ -d "AURA_FIREBASE_GITHUB_FINAL" ]; then
              mv AURA_FIREBASE_GITHUB_FINAL/*. || true
              mv AURA_FIREBASE_GITHUB_FINAL/.*. 2>/dev/null || true
            fi
          fi
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
      - name: Build APK
        run: |
          if [! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew
         ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
