name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip AURA project
        run: |
          ls -la
          unzip -o *.zip || true
          rm -rf __MACOSX
          GRADLE_DIR=$(find . -maxdepth 4 -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "Found gradle in: $GRADLE_DIR"
          if [ "$GRADLE_DIR" != "" ] && [ "$GRADLE_DIR" != "." ]; then
            cp -rf $GRADLE_DIR/* .
            cp -rf $GRADLE_DIR/.* . 2>/dev/null || true
          fi
          rm -rf AURA* *.zip
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-APK
          path: app/build/outputs/apk/debug/*.apk
