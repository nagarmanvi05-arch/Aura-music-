name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip AURA project
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "Unzipping $ZIP"
          unzip -o "$ZIP"
          FOLDER=$(ls -d */ | grep -i AURA | head -n 1)
          echo "Folder $FOLDER"
          if [ -d "$FOLDER" ]; then
            cp -r "$FOLDER"/*.
            cp -r "$FOLDER"/.*. 2>/dev/null || true
            rm -rf "$FOLDER"
          fi
          rm -f *.zip
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
